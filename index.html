<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Se Kaho - Happy Independence Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Times New Roman', Times, serif; /* Premium feel */
        }

        /* --- 1. Enhanced Intro/Start Overlay --- */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #start-overlay .ashoka-chakra {
            width: 80px;
            height: 80px;
            margin-bottom: 30px;
            opacity: 0.7;
            animation: rotateChakra 10s linear infinite;
        }

        @keyframes rotateChakra {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #start-overlay h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #FF9933 30%, #FFFFFF 50%, #138808 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        #start-overlay p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .play-btn {
            padding: 18px 45px;
            font-size: 1.3rem;
            color: #fff;
            background: transparent;
            border: 2px solid;
            border-image: linear-gradient(45deg, #FF9933, #138808) 1;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 153, 51, 0.2);
        }

        .play-btn:hover {
            background: linear-gradient(45deg, #FF9933, #138808);
            box-shadow: 0 0 30px rgba(255, 153, 51, 0.5);
            transform: scale(1.05);
        }

        /* --- Main Experience Container --- */
        .experience-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: none; /* Initially hidden */
        }

        /* --- 2. Darker Cinematic Slideshow --- */
        .slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            /* Ken Burns effect */
            transform: scale(1.1);
        }

        .slide.active {
            opacity: 1;
            animation: kenBurns 8s linear forwards;
        }

        @keyframes kenBurns {
            0% { transform: scale(1.1) translate(0, 0); }
            100% { transform: scale(1) translate(-1%, -1%); }
        }

        /* Darkening Overlays */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Stronger darkness from edges */
            background: radial-gradient(circle, rgba(0,0,0,0.2) 30%, rgba(0,0,0,0.95) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Global dimming */
            z-index: 2;
            pointer-events: none;
        }

        /* --- 3. Stable, Bigger Middle Logo --- */
        .middle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Above particles and slideshow */
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .middle-img {
            /* BIGGER Size */
            max-width: 85vw;
            max-height: 70vh;
            object-fit: contain;
            filter: drop-shadow(0px 15px 40px rgba(0, 0, 0, 1));
            /* STABLE: No beat movement, just a slow gentle float */
            animation: slowFloat 6s ease-in-out infinite;
        }

        @keyframes slowFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* --- 4. Floating Small Particles (Background) --- */
        #particles-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4; /* Below middle logo, above slides */
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- 5. Unique Beat Explosion Visualizer --- */
        #visualizer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* Between particles and logo */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Start Overlay (Intro) -->
    <div id="start-overlay" onclick="startExperience()">
        <!-- SVG Ashoka Chakra for intro -->
        <svg class="ashoka-chakra" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" stroke="#000080" stroke-width="2" fill="none"/>
            <circle cx="50" cy="50" r="8" fill="#000080"/>
            <g stroke="#000080" stroke-width="1.5">
                <line x1="50" y1="50" x2="50" y2="2"/>
                <line x1="50" y1="50" x2="50" y2="98"/>
                <line x1="50" y1="50" x2="2" y2="50"/>
                <line x1="50" y1="50" x2="98" y2="50"/>
                <!-- Add 20 more lines for 24 spokes if desired, keeping it simple for now -->
            </g>
        </svg>
        <h1>स्वतंत्रता दिवस</h1>
        <p>A Cinematic Experience</p>
        <button class="play-btn">प्रारंभ करें</button>
    </div>

    <!-- Background Audio -->
    <audio id="bg-audio" src="independenceday.mp3" loop></audio>

    <!-- Main Experience Container -->
    <div class="experience-wrapper" id="main-wrapper">
        <!-- 2. Darker Slideshow -->
        <div class="slideshow-container">
            <div class="slide" style="background-image: url('id1.png');"></div>
            <div class="slide" style="background-image: url('id2.png');"></div>
            <div class="slide" style="background-image: url('id3.png');"></div>
            <div class="slide" style="background-image: url('id4.png');"></div>
            <div class="slide" style="background-image: url('id5.png');"></div>
        </div>

        <div class="dark-overlay"></div>
        <div class="vignette"></div>

        <!-- 4. Floating Background Particles Canvas -->
        <canvas id="particles-bg-canvas"></canvas>

        <!-- 5. Unique Beat Explosion Canvas -->
        <canvas id="visualizer-canvas"></canvas>

        <!-- 3. Stable, Bigger Middle Logo -->
        <div class="middle-container">
            <img src="20260814_182718.png" alt="Centerpiece" class="middle-img">
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const slideDuration = 7000; // 7 seconds per slide

        function changeSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function startExperience() {
            const overlay = document.getElementById('start-overlay');
            const wrapper = document.getElementById('main-wrapper');
            const audio = document.getElementById('bg-audio');

            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                wrapper.style.display = 'block';

                // Start Slideshow
                slides[0].classList.add('active');
                setInterval(changeSlide, slideDuration);

                // Start Audio
                audio.play().catch(e => console.log("Audio error:", e));

                // Initialize Background Particles
                initBackgroundParticles();

                // Initialize Unique Beat Explosion
                initBeatExplosion(audio);

            }, 1000);
        }

        /* --- 4. Background Floating Particles Logic --- */
        function initBackgroundParticles() {
            const canvas = document.getElementById('particles-bg-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const particles = [];
            const particleCount = 100;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    color: Math.random() > 0.5 ? '#fff' : '#FFD700', // White or Gold
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter';

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // Move particles
                    p.x += p.vx;
                    p.y += p.vy;

                    // Boundary check
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });

                requestAnimationFrame(drawParticles);
            }
            drawParticles();
        }

        /* --- 5. Unique Beat Explosion Logic --- */
        function initBeatExplosion(audioElement) {
            const canvas = document.getElementById('visualizer-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            analyser.fftSize = 64; // Small fftSize for base detection
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const explosionParticles = [];
            const tricolor = ['#FF9933', '#FFFFFF', '#138808']; // Saffron, White, Green

            class ExplosionParticle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 8 + 2;
                    this.radius = Math.random() * 3 + 1;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.96; // Friction
                    this.vy *= 0.96;
                    this.alpha -= this.decay;
                }
            }

            function triggerExplosion() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                for (let i = 0; i < 30; i++) {
                    const color = tricolor[Math.floor(Math.random() * tricolor.length)];
                    explosionParticles.push(new ExplosionParticle(centerX, centerY, color));
                }
            }

            let lastBeatTime = 0;
            const beatThreshold = 210; // Adjust based on song's bass level

            function drawBeatExplosion() {
                requestAnimationFrame(drawBeatExplosion);
                analyser.getByteFrequencyData(dataArray);

                // Analyze low frequencies (bass)
                let sumLow = 0;
                for(let i=0; i<5; i++) { sumLow += dataArray[i]; }
                const avgLow = sumLow / 5;

                const currentTime = Date.now();
                if (avgLow > beatThreshold && currentTime - lastBeatTime > 250) { // Throttling
                    triggerExplosion();
                    lastBeatTime = currentTime;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter';

                for (let i = explosionParticles.length - 1; i >= 0; i--) {
                    const p = explosionParticles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0) {
                        explosionParticles.splice(i, 1);
                    }
                }
            }
            
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            drawBeatExplosion();
        }

    </script>
</body>
</html>
