<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Ka Amrit Mahotsav - Happy Independence Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Poppins', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Modern Premium Font */
        }

        /* =========================================
           --- 1. EPIC INTRO / START OVERLAY ---
           ========================================= */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Deep cinematic gradient background */
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
            overflow: hidden;
        }

        #start-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Animated Cinematic Smoke/Fog Background */
        #intro-smoke {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEAAQMAAABM/+fIAAAABlBMVEUAAAAAAAClZ7nPAAAAAXRSTlMAQObYZgAAABhJREFUeNrtwTEBAAAAwiD7p1bGDmAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAO8B45MAAVfVvXkAAAAASUVORK5CYII=') repeat;
            opacity: 0.03;
            animation: smokeMove 60s linear infinite;
            pointer-events: none;
        }

        @keyframes smokeMove {
            from { background-position: 0 0; }
            to { background-position: 1000px 500px; }
        }

        /* Ashoka Chakra with Fade-In & Rotate Animation */
        .intro-chakra {
            width: 100px;
            height: 100px;
            margin-bottom: 40px;
            opacity: 0;
            transform: scale(0.5) rotate(-180deg);
            animation: chakraEntry 2s cubic-bezier(0.19, 1, 0.22, 1) forwards 0.5s, rotateChakra 15s linear infinite 2.5s;
            filter: drop-shadow(0 0 10px rgba(0, 0, 128, 0.5));
        }

        @keyframes chakraEntry {
            to { opacity: 0.8; transform: scale(1) rotate(0deg); }
        }

        @keyframes rotateChakra {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Split Text Reveal Animation (Saffron & Green) */
        .intro-title-container {
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .intro-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-align: center;
            line-height: 1.2;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.5s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .title-top, .title-bottom {
            display: block;
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .title-top {
            top: 0;
            color: #FF9933; /* Saffron */
            transform: translateY(-100%);
            animation: titleSlideIn 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards 1.8s;
        }

        .title-bottom {
            bottom: 0;
            color: #138808; /* Green */
            transform: translateY(100%);
            animation: titleSlideIn 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards 1.8s;
        }

        @keyframes titleSlideIn { to { transform: translateY(0); } }

        /* A decorative line that glows and expands */
        .intro-line {
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FF9933, #FFFFFF, #138808, transparent);
            margin-bottom: 50px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            animation: lineExpand 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards 2.5s;
        }

        @keyframes lineExpand { to { width: 300px; } }

        /* Subtitle */
        #start-overlay p {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 60px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1s ease forwards 3s;
        }

        /* Premium Pulsing Play Button */
        .play-btn-wrapper {
            position: relative;
            opacity: 0;
            animation: fadeIn 1s ease forwards 3.5s;
        }

        .play-btn {
            padding: 20px 50px;
            font-size: 1.4rem;
            color: #fff;
            background: transparent;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 2;
            position: relative;
        }

        /* Gradient Border for the Button */
        .play-btn-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-radius: 4px;
            background: linear-gradient(45deg, #FF9933, #138808) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            z-index: 1;
        }

        /* Pulsing Glow Effect behind the Button */
        .play-btn-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #FF9933, #138808);
            filter: blur(15px);
            opacity: 0.3;
            border-radius: 4px;
            animation: pulseGlow 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        .play-btn-wrapper:hover .play-btn {
            color: #000;
            background: linear-gradient(45deg, #FF9933, #FFFFFF, #138808);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
        }

        .play-btn-wrapper:hover .play-btn-glow {
            animation: none;
            opacity: 0;
        }


        /* =========================================
           --- MAIN EXPERIENCE CONTAINER ---
           ========================================= */
        .experience-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: none; /* Initially hidden */
        }

        /* --- 2. Darker Cinematic Slideshow --- */
        .slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            /* Ken Burns effect */
            transform: scale(1.15);
        }

        .slide.active {
            opacity: 1;
            animation: kenBurns 10s linear forwards;
        }

        @keyframes kenBurns {
            0% { transform: scale(1.15) translate(0, 0); }
            100% { transform: scale(1) translate(-1.5%, -1.5%); }
        }

        /* Super Dark Cinematic Overlays */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Intense darkness from edges */
            background: radial-gradient(circle at center, rgba(0,0,0,0) 20%, rgba(0,0,0,0.98) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65); /* Increased overall dimming */
            z-index: 2;
            pointer-events: none;
        }

        /* --- 3. Stable, Bigger Middle Logo --- */
        .middle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Topmost, above particles and slideshow */
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .middle-img {
            /* HUGE Size */
            max-width: 90vw;
            max-height: 75vh;
            object-fit: contain;
            filter: drop-shadow(0px 20px 50px rgba(0, 0, 0, 1)) contrast(1.1);
            /* STABLE: No beat movement, very slow elegant float */
            animation: elegantFloat 8s ease-in-out infinite;
        }

        @keyframes elegantFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* --- 4. Floating Small Particles (Background) --- */
        #particles-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4; /* Below middle logo, above slides */
            pointer-events: none;
            opacity: 0.7;
        }

        /* --- 5. Unique Beat Explosion Visualizer --- */
        #visualizer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* Between particles and logo */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Start Overlay (Intro) -->
    <div id="start-overlay" onclick="startExperience()">
        <div id="intro-smoke"></div>
        
        <!-- SVG Ashoka Chakra for intro entry -->
        <svg class="intro-chakra" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" stroke="#000080" stroke-width="3" fill="none"/>
            <circle cx="50" cy="50" r="10" fill="#000080"/>
            <g stroke="#000080" stroke-width="2">
                <!-- 24 Spokes simple representation -->
                <line x1="50" y1="50" x2="50" y2="2"/> <line x1="50" y1="50" x2="50" y2="98"/>
                <line x1="50" y1="50" x2="2" y2="50"/> <line x1="50" y1="50" x2="98" y2="50"/>
                <line x1="50" y1="50" x2="14.6" y2="14.6"/> <line x1="50" y1="50" x2="85.4" y2="85.4"/>
                <line x1="50" y1="50" x2="14.6" y2="85.4"/> <line x1="50" y1="50" x2="85.4" y2="14.6"/>
            </g>
        </svg>

        <div class="intro-title-container">
            <!-- Normal text as base -->
            <div class="intro-title">स्वतंत्रता दिवस</div>
            <!-- Split animated overlays -->
            <div class="intro-title title-top">स्वतंत्रता दिवस</div>
            <div class="intro-title title-bottom">स्वतंत्रता दिवस</div>
        </div>

        <div class="intro-line"></div>

        <p>गर्व और सम्मान के साथ</p>
        
        <div class="play-btn-wrapper">
            <div class="play-btn-glow"></div>
            <div class="play-btn-border"></div>
            <button class="play-btn">प्रारंभ करें</button>
        </div>
    </div>

    <!-- Background Audio -->
    <audio id="bg-audio" src="independenceday.mp3" loop></audio>

    <!-- Main Experience Container -->
    <div class="experience-wrapper" id="main-wrapper">
        <!-- 2. Darker Slideshow -->
        <div class="slideshow-container">
            <div class="slide" style="background-image: url('id1.png');"></div>
            <div class="slide" style="background-image: url('id2.png');"></div>
            <div class="slide" style="background-image: url('id3.png');"></div>
            <div class="slide" style="background-image: url('id4.png');"></div>
            <div class="slide" style="background-image: url('id5.png');"></div>
        </div>

        <div class="dark-overlay"></div>
        <div class="vignette"></div>

        <!-- 4. Floating Background Particles Canvas -->
        <canvas id="particles-bg-canvas"></canvas>

        <!-- 5. Unique Beat Explosion Canvas -->
        <canvas id="visualizer-canvas"></canvas>

        <!-- 3. Stable, Bigger Middle Logo -->
        <div class="middle-container">
            <img src="20260814_182718.png" alt="Centerpiece" class="middle-img">
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const slideDuration = 8000; // 8 seconds per slide for slower, more cinematic feel

        function changeSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function startExperience() {
            const overlay = document.getElementById('start-overlay');
            const wrapper = document.getElementById('main-wrapper');
            const audio = document.getElementById('bg-audio');

            // Epic Fade-out Intro
            overlay.classList.add('fade-out');

            setTimeout(() => {
                wrapper.style.display = 'block';

                // Start Slideshow
                slides[0].classList.add('active');
                setInterval(changeSlide, slideDuration);

                // Start Audio
                audio.play().catch(e => console.log("Audio error. Autoplay blocked. Try user interaction first.", e));

                // Initialize Background Particles
                initBackgroundParticles();

                // Initialize Unique Beat Explosion
                initBeatExplosion(audio);

            }, 1200); // Sync with overlay fade-out duration
        }

        /* --- 4. Background Floating Particles Logic (Saffron, White, Green hints) --- */
        function initBackgroundParticles() {
            const canvas = document.getElementById('particles-bg-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const particles = [];
            const particleCount = 120;
            const colors = ['#fff', '#FFD700', '#FF9933', '#138808']; // Saffron, Green hints added

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.8 + 0.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter'; // Particles glow when they overlap

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // Move particles slowly
                    p.x += p.vx;
                    p.y += p.vy;

                    // Boundary wrap-around
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });

                requestAnimationFrame(drawParticles);
            }
            drawParticles();
        }

        /* --- 5. Unique Beat Explosion Logic (Behind Logo) --- */
        function initBeatExplosion(audioElement) {
            const canvas = document.getElementById('visualizer-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            // Web Audio API Context
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            analyser.fftSize = 64; // Small fftSize is good for bass/beat detection
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const explosionParticles = [];
            const tricolor = ['#FF9933', '#FFFFFF', '#138808']; // Saffron, White, Green

            class ExplosionParticle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.angle = Math.random() * Math.PI * 2;
                    // Explosion force from logo center
                    this.speed = Math.random() * 10 + 3;
                    this.radius = Math.random() * 3.5 + 1.2;
                    this.alpha = 1;
                    // Particle fades out over time
                    this.decay = Math.random() * 0.015 + 0.008;
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    // Add friction so particles slow down
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                    this.alpha -= this.decay;
                }
            }

            // Function to create a tricolor explosion from center
            function triggerExplosion() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                for (let i = 0; i < 40; i++) { // More particles per beat
                    const color = tricolor[Math.floor(Math.random() * tricolor.length)];
                    explosionParticles.push(new ExplosionParticle(centerX, centerY, color));
                }
            }

            let lastBeatTime = 0;
            // Beat threshold depends heavily on the song. Adjust as needed.
            const beatThreshold = 215; 

            function drawBeatExplosion() {
                requestAnimationFrame(drawBeatExplosion);
                analyser.getByteFrequencyData(dataArray);

                // Analyze low frequency bins (0-4 generally hold bass/beats)
                let sumLow = 0;
                for(let i=0; i<4; i++) { sumLow += dataArray[i]; }
                const avgLow = sumLow / 4;

                const currentTime = Date.now();
                // Check if avg bass level exceeds threshold and isn't too close to the last beat
                if (avgLow > beatThreshold && currentTime - lastBeatTime > 280) {
                    triggerExplosion();
                    lastBeatTime = currentTime;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter'; // Particles glow together

                // Update and draw each particle, removing dead ones
                for (let i = explosionParticles.length - 1; i >= 0; i--) {
                    const p = explosionParticles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0) {
                        explosionParticles.splice(i, 1);
                    }
                }
            }
            
            // Resume AudioContext on first click (handled by overlay click)
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            drawBeatExplosion();
        }

    </script>
</body>
</html>
