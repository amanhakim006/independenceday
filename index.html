<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Se Kaho - Happy Independence Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* Premium, patriotic font hierarchy */
            font-family: 'Georgia', 'Times New Roman', Times, serif;
        }

        /* --- 1. PRESTIGIOUS INTRO / START OVERLAY (Improved) --- */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Deep, dark radial gradient for mystery */
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
            text-align: center;
            padding: 20px;
        }

        #start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Animated Ashoka Chakra SVG */
        #start-overlay .chakra-container {
            width: 100px;
            height: 100px;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 10px rgba(0, 0, 128, 0.5));
            animation: chakraAppear 1.5s ease-out;
        }

        .ashoka-chakra-svg {
            width: 100%;
            height: 100%;
            animation: rotateChakra 15s linear infinite;
        }

        @keyframes rotateChakra {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes chakraAppear {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Golden Gradient Text for Title */
        #start-overlay h1 {
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 15px;
            /* Majestic Golden Gradient */
            background: linear-gradient(to bottom, #cf9c49 0%, #f9e1a1 25%, #cf9c49 50%, #f9e1a1 75%, #cf9c49 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            animation: titleAppear 2s ease-out;
        }

        @keyframes titleAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subtitle */
        #start-overlay p.subtitle {
            font-size: 1.2rem;
            color: #b5b5b5;
            letter-spacing: 3px;
            margin-bottom: 50px;
            text-transform: uppercase;
            font-weight: 300;
            animation: subtitleAppear 2.5s ease-out;
        }

        @keyframes subtitleAppear {
            from { opacity: 0; }
            to { opacity: 0.8; }
        }

        /* Premium Border Button */
        .play-btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            color: #f9e1a1;
            background: transparent;
            border: 1px solid #cf9c49;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: btnAppear 3s ease-out;
        }

        @keyframes btnAppear {
            from { opacity: 0; translateY: 10px; }
            to { opacity: 1; translateY: 0; }
        }

        .play-btn:hover {
            color: #000;
            background: linear-gradient(45deg, #cf9c49, #f9e1a1);
            box-shadow: 0 0 25px rgba(207, 156, 73, 0.6);
            transform: scale(1.05);
        }

        /* --- Main Experience Container --- */
        .experience-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            opacity: 0; /* Initially hidden for fade-in */
            transition: opacity 1.5s ease-in-out;
        }

        .experience-wrapper.visible {
            opacity: 1;
        }

        /* --- 2. DARKER CINEMATIC SLIDESHOW --- */
        .slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            /* Subtle Ken Burns effect */
            transform: scale(1.05);
        }

        .slide.active {
            opacity: 1;
            animation: kenBurns 9s linear forwards;
        }

        @keyframes kenBurns {
            0% { transform: scale(1.05) translate(0, 0); }
            100% { transform: scale(1) translate(-1%, -1%); }
        }

        /* Darkening Overlays */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Extra strong darkness from edges */
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.98) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* Deeper global dimming */
            z-index: 2;
            pointer-events: none;
        }

        /* --- 3. STABLE, BIGGER MIDDLE LOGO --- */
        .middle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Above particles and slides */
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .middle-img {
            /* BIGGER Size */
            max-width: 90vw;
            max-height: 75vh;
            object-fit: contain;
            filter: drop-shadow(0px 15px 40px rgba(0, 0, 0, 1));
            /* STABLE: A very slow, grand gentle float */
            animation: grandFloat 8s ease-in-out infinite;
        }

        @keyframes grandFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.01); }
        }

        /* --- 4. FLOATING SMALL PARTICLES (Background) --- */
        #particles-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4; /* Below middle logo, above slides */
            pointer-events: none;
            opacity: 0.5;
        }

        /* --- 5. UNIQUE BEAT EXPLOSION VISUALIZER --- */
        #visualizer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* Between particles and logo */
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Start Overlay (Improved Intro) -->
    <div id="start-overlay" onclick="startExperience()">
        <div class="chakra-container">
            <!-- SVG Ashoka Chakra for intro -->
            <svg class="ashoka-chakra-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" stroke="#000080" stroke-width="2" fill="none"/>
                <circle cx="50" cy="50" r="8" fill="#000080"/>
                <g stroke="#000080" stroke-width="1.5">
                    <line x1="50" y1="50" x2="50" y2="2"/>
                    <line x1="50" y1="50" x2="50" y2="98"/>
                    <line x1="50" y1="50" x2="2" y2="50"/>
                    <line x1="50" y1="50" x2="98" y2="50"/>
                    <!-- Simple spokes representation -->
                    <line x1="50" y1="50" x2="16" y2="16"/><line x1="50" y1="50" x2="84" y2="84"/>
                    <line x1="50" y1="50" x2="84" y2="16"/><line x1="50" y1="50" x2="16" y2="84"/>
                </g>
            </svg>
        </div>
        <h1>स्वतंत्रता दिवस</h1>
        <p class="subtitle">An Immersive Experience</p>
        <button class="play-btn">Click to Begin</button>
    </div>

    <!-- Background Audio -->
    <audio id="bg-audio" src="independenceday.mp3" loop></audio>

    <!-- Main Experience Container -->
    <div class="experience-wrapper" id="main-wrapper">
        <!-- 2. Darker Slideshow -->
        <div class="slideshow-container">
            <div class="slide" style="background-image: url('id1.png');"></div>
            <div class="slide" style="background-image: url('id2.png');"></div>
            <div class="slide" style="background-image: url('id3.png');"></div>
            <div class="slide" style="background-image: url('id4.png');"></div>
            <div class="slide" style="background-image: url('id5.png');"></div>
        </div>

        <div class="dark-overlay"></div>
        <div class="vignette"></div>

        <!-- 4. Floating Background Particles Canvas -->
        <canvas id="particles-bg-canvas"></canvas>

        <!-- 5. Unique Beat Explosion Canvas -->
        <canvas id="visualizer-canvas"></canvas>

        <!-- 3. Stable, Bigger Middle Logo -->
        <div class="middle-container">
            <img src="20260814_182718.png" alt="Centerpiece" class="middle-img">
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const slideDuration = 8000; // 8 seconds per slide for slower feel

        function changeSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function startExperience() {
            const overlay = document.getElementById('start-overlay');
            const wrapper = document.getElementById('main-wrapper');
            const audio = document.getElementById('bg-audio');

            // 1. Fade out overlay
            overlay.classList.add('hidden');

            // 2. Fade in main content after a short delay
            setTimeout(() => {
                wrapper.classList.add('visible');

                // Start Audio
                audio.play().catch(e => console.log("Audio error:", e));

                // Start Slideshow
                slides[0].classList.add('active');
                setInterval(changeSlide, slideDuration);

                // Initialize Background Particles
                initBackgroundParticles();

                // Initialize Unique Beat Explosion
                initBeatExplosion(audio);

            }, 800);
        }

        /* --- 4. Background Floating Particles Logic --- */
        function initBackgroundParticles() {
            const canvas = document.getElementById('particles-bg-canvas');
            const ctx = canvas.getContext('particles-bg-canvas').getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const particles = [];
            const particleCount = 120; // Slightly more particles

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.8 + 0.3,
                    color: Math.random() > 0.4 ? '#fff' : '#f9e1a1', // White or Pale Gold
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter';

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // Move particles
                    p.x += p.vx;
                    p.y += p.vy;

                    // Boundary check (wrap around)
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });

                requestAnimationFrame(drawParticles);
            }
            drawParticles();
        }

        /* --- 5. Unique Beat Explosion Logic --- */
        function initBeatExplosion(audioElement) {
            const canvas = document.getElementById('visualizer-canvas');
            const ctx = canvas.getContext('visualizer-canvas').getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            analyser.fftSize = 64; // Small fftSize for base detection
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const explosionParticles = [];
            // Flag Tricolor: Saffron, White, Green
            const tricolor = ['#FF9933', '#FFFFFF', '#138808'];

            class ExplosionParticle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 10 + 3; // Slightly faster explosion
                    this.radius = Math.random() * 3.5 + 1;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.025 + 0.015; // Fade out speed
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.95; // Friction
                    this.vy *= 0.95;
                    this.alpha -= this.decay;
                }
            }

            function triggerExplosion() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                for (let i = 0; i < 40; i++) { // More particles per explosion
                    const color = tricolor[Math.floor(Math.random() * tricolor.length)];
                    explosionParticles.push(new ExplosionParticle(centerX, centerY, color));
                }
            }

            let lastBeatTime = 0;
            const beatThreshold = 215; // Adjust based on song's bass level

            function drawBeatExplosion() {
                requestAnimationFrame(drawBeatExplosion);
                analyser.getByteFrequencyData(dataArray);

                // Analyze low frequencies (bass)
                let sumLow = 0;
                for(let i=0; i<4; i++) { sumLow += dataArray[i]; } // Focus on very low bass
                const avgLow = sumLow / 4;

                const currentTime = Date.now();
                if (avgLow > beatThreshold && currentTime - lastBeatTime > 280) { // Throttling
                    triggerExplosion();
                    lastBeatTime = currentTime;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter'; // Particles blend beautifully

                for (let i = explosionParticles.length - 1; i >= 0; i--) {
                    const p = explosionParticles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0) {
                        explosionParticles.splice(i, 1); // Remove faded particles
                    }
                }
            }
            
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            drawBeatExplosion();
        }

    </script>
</body>
</html>
