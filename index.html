<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्वतंत्रता दिवस मुबारक!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slideshow-container">
        <div class="mySlides fade">
            <img src="id1.png" alt="ID1">
        </div>
        <div class="mySlides fade">
            <img src="id2.png" alt="ID2">
        </div>
        <div class="mySlides fade">
            <img src="id3.png" alt="ID3">
        </div>
        <div class="mySlides fade">
            <img src="id4.png" alt="ID4">
        </div>
        <div class="mySlides fade">
            <img src="id5.png" alt="ID5">
        </div>

        <!-- Add middle image with animation -->
        <img src="20260814_182718.png" alt="Middle Image" class="middle-image">
    </div>

    <!-- Background audio -->
    <audio id="bg-audio" src="independenceday.mp3" preload="auto"></audio>

    <!-- Beats graph (optional) -->
    <div class="beats-graph"></div>

    <script src="script.js"></script>
</body>
</html>
